[build-system]
requires = ["setuptools>=74.1", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "camoscope"
version = "0.1.3"
description = "Investigate potentially concealed app windows in online interviews on macOS."
readme = "README.md"
requires-python = ">=3.9,<3.15"
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]
macos = [
    "pyobjc-framework-Quartz>=10.3",
    "pyobjc-framework-ApplicationServices>=10.3",
    "pyobjc-framework-Cocoa>=10.3",
]

[project.scripts]
camoscope = "camoscope.cli:main"

[project.urls]
Homepage = "https://www.rajsharma.space/"
Documentation = "https://pypi.org/project/camoscope/"
Support = "https://www.rajsharma.space/#contact"
Funding = "https://github.com/sponsors/rajiitmandi21"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false
ext-modules = [
    {name = "camoscope.cli", sources = ["src/camoscope/cli.pyx"]},
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
test-command = "python -m camoscope --version"
