[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camoscope"
version = "0.1.0"
description = "Audit a macOS screen-share session for windows hidden from capture, verify their real identity, and preview their content."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Operating System :: MacOS",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Private :: Do Not Upload",
]
dependencies = [
    "pyobjc-framework-Quartz",
    "pyobjc-framework-ApplicationServices",
]

[project.scripts]
camoscope = "camoscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
