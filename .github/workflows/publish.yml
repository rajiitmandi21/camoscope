name: Publish compiled wheels to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheels:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open('pyproject.toml', 'rb') as source:
              version = tomllib.load(source)['project']['version']
          expected = f'v{version}'
          actual = os.environ['GITHUB_REF_NAME']
          if actual != expected:
              raise SystemExit(f'tag {actual} does not match package version {expected}')
          PY
      - name: Build native macOS wheels
        uses: pypa/cibuildwheel@v4.2.1
      - name: Audit wheel contents
        run: python scripts/audit_wheels.py wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  audit:
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metadata checker
        run: python -m pip install --upgrade twine
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true
      - name: Require complete macOS matrix and source-free wheels
        run: python scripts/audit_wheels.py dist --require-complete-matrix
      - name: Check package metadata and README
        run: python -m twine check --strict dist/*.whl

  publish:
    needs: audit
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/camoscope/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true
      - name: Publish wheels with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
